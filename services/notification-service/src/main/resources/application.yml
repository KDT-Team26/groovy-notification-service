spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  # Phase 7(DB per Service): 전용 스키마(notification_db)와 그 스키마에만 권한이 있는
  # 전용 DB 계정을 쓴다(더 이상 groovy_db/root 공유 아님). 이 서비스가 자체 Flyway 이력
  # (db/migration/V1__create_notifications_table.sql)으로 스키마를 직접 소유한다.
  datasource:
    url: ${SPRING_DEV_DB_URL:jdbc:mysql://localhost:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DEV_DB_USERNAME:notification_service}
    password: ${SPRING_DEV_DB_PASSWORD:notification_service_local_only_pw}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: NotificationHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # MSA 전환 Phase 9: legacy의 OutboxRelay가 발행한 이벤트를 NotificationEventConsumer가 소비.
  # Phase 10: SASL/PLAIN 인증(legacy application.yml과 동일한 이유).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    properties:
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # AppConfig의 kafkaErrorHandler(DeadLetterPublishingRecoverer)가 처리 실패한 메시지를
    # <topic>.DLT로 재발행할 때 쓴다 — study/calendar/content-service의 producer 설정과 동일.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      # Phase 12: legacy가 실어보낸 traceId를 이어받아 같은 트레이스로 스팬을 이어붙인다.
      observation-enabled: true

server:
  port: 8085

# MSA 전환 Phase 10: 더 이상 JWT_SECRET_KEY(HMAC 공유 시크릿)를 쓰지 않는다. identity-service가
# 유일한 JWT 발급자다 — 이 서비스는 검증만 한다(study/calendar/content-service와 동일한 패턴).
# JwksKeyLocator가 이 주소에서 identity-service의 공개키(JWKS)를 가져온다.
# Phase 11: 캐시 TTL을 짧게 두면(예: 검증 시) identity-service가 죽어 있는 동안 재시도/서킷
# 브레이커/폴백 동작을 실제로 관찰할 수 있다. 기본값(5분)은 운영에 적합한 값.
jwt:
  jwks-url: ${JWT_JWKS_URL:http://identity-service:8081/.well-known/jwks.json}
  jwks-connect-timeout-ms: ${JWT_JWKS_CONNECT_TIMEOUT_MS:2000}
  jwks-read-timeout-ms: ${JWT_JWKS_READ_TIMEOUT_MS:3000}
  jwks-cache-ttl-seconds: ${JWT_JWKS_CACHE_TTL_SECONDS:300}

notification:
  kafka:
    topic: notification-events

# MSA 전환 Phase 12: legacy application.yml과 동일한 이유(TracingConfig 참고).
management:
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
