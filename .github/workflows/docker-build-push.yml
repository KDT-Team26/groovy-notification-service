# TODO(폴리레포 전환 — 후속 작업):
#   - NotificationServiceApplicationTests(@SpringBootTest 컨텍스트 로드 테스트)가 CI에 아직 안
#     붙어있다. 실제 MySQL/Redis/Kafka가 필요한데, 폴리레포 전환 계획서 6장 2단계(과도기)에서는
#     groovy-infra가 아직 없어 로컬/CI 통합 테스트가 원본 Groovy 레포의 docker-compose.local.yml에
#     의존하는 상태이므로, 이 서비스 레포 CI에서 테스트를 어떻게 돌릴지(서비스 컨테이너 도입 vs
#     계속 보류)는 그 정책이 정해진 뒤 채운다.
name: Notification Service Build and Push

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # event-contract 계약 안전장치(폴리레포 전환 계획서 3장): study/calendar/content-service가
  # 발행하고 이 서비스가 구독하는 EventEnvelope+NotificationPayload는 더 이상 컴파일 타임에
  # 같은 소스를 공유하지 않으므로, 각 레포가 고정 fixture(NotificationEventConsumerContractTest +
  # src/test/resources/contracts/application-received-event.json)로 실제 역직렬화 스키마가
  # 어긋나지 않는지 CI에서 검증한다. 발행 쪽 payload 필드가 바뀌면 이 테스트가 여기서 깨진다.
  #
  # NotificationServiceApplicationTests 등 실제 MySQL/Redis/Kafka가 필요한 @SpringBootTest는
  # 제외한다 — 폴리레포 전환 계획서 6장 2단계(과도기)에서는 아직 groovy-infra가 없어 로컬
  # 통합 테스트가 원본 Groovy 레포의 docker-compose.local.yml을 참조하는 단계이기 때문이다.
  contract-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run event-contract schema tests
        run: ./gradlew :services:notification-service:test --tests "*ContractTest" --no-daemon

  notification-service:
    needs: contract-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push notification-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            bebeghi/groovy-notification-service:latest
            bebeghi/groovy-notification-service:${{ github.sha }}
          cache-from: type=gha,scope=notification-service
          cache-to: type=gha,mode=max,scope=notification-service
