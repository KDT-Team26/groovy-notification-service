# 실배포 워크플로우
# main에 push될 때만 이미지를 빌드해 ECR에 push하고, ArgoCD가 배포
name: Notification Service Build and Push

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # OIDC로 ECR push용 IAM 역할을 assume하기 위해 필요

jobs:
  # event-contract 계약 안전장치: study/calendar/content-service가
  # 발행하고 이 서비스가 구독하는 EventEnvelope+NotificationPayload는 더 이상 컴파일 타임에
  # 같은 소스를 공유하지 않으므로, 각 레포가 고정 fixture(NotificationEventConsumerContractTest +
  # src/test/resources/contracts/application-received-event.json)로 실제 역직렬화 스키마가
  # 어긋나지 않는지 CI에서 검증한다. 발행 쪽 payload 필드가 바뀌면 이 테스트가 여기서 깨진다.

  contract-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run event-contract schema tests
        run: ./gradlew :services:notification-service:test --tests "*ContractTest" --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}

  notification-service:
    needs: contract-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::665206375378:role/groovy-github-actions-ecr-role
          aws-region: ap-northeast-2

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push notification-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          secrets: |
            gpr_actor=${{ github.actor }}
            gpr_token=${{ secrets.GPR_TOKEN }}
          # sha 태그만 쓴다(:latest 같은 가변 태그 없음) — GitOps는 groovy-infra의 values.yaml에
          # 박힌 정확한 태그로만 배포 대상을 판단하므로, 가변 태그가 있으면 오히려 혼란만 준다.
          tags: ${{ steps.ecr-login.outputs.registry }}/groovy-notification-service:${{ github.sha }}
          cache-from: type=gha,scope=notification-service
          cache-to: type=gha,mode=max,scope=notification-service

      # 여기서부터 CD 연결 — groovy-infra의 main 브랜치에 있는 이 서비스의 values.yaml 이미지
      # 태그를 새로 push한 sha로 갱신해 커밋한다.
      - name: Checkout groovy-infra
        uses: actions/checkout@v4
        with:
          repository: KDT-Team26/groovy-infra
          ref: main
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: groovy-infra

      - name: Bump image tag in groovy-infra
        working-directory: groovy-infra
        run: |
          sed -i -E "s/^(    tag: ).*/\1\"${{ github.sha }}\"/" helm/notification-service/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/notification-service/values.yaml
          if git diff --cached --quiet; then
            echo "이미지 태그가 이미 최신 상태라 커밋할 변경 사항이 없습니다."
          else
            git commit -m "chore(notification-service): bump image tag to ${{ github.sha }}"
            git push
          fi
