# Phase 01(Groovy GitOps 빌드 지시서) — dev 전용 테스트 CI.
# main 트리거인 build-and-deploy.yml과 독립된 워크플로다.
# dev push/PR에서는 이미지 빌드·push 없이 contract-test만 수행한다 — Docker Hub 시크릿 불필요.
name: CI Test

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  # event-contract 계약 안전장치(폴리레포 전환 계획서 3장): study/calendar/content-service가
  # 발행하고 이 서비스가 구독하는 EventEnvelope+NotificationPayload는 더 이상 컴파일 타임에
  # 같은 소스를 공유하지 않으므로, 각 레포가 고정 fixture(NotificationEventConsumerContractTest +
  # src/test/resources/contracts/application-received-event.json)로 실제 역직렬화 스키마가
  # 어긋나지 않는지 CI에서 검증한다. 발행 쪽 payload 필드가 바뀌면 이 테스트가 여기서 깨진다.
  #
  # NotificationServiceApplicationTests 등 실제 MySQL/Redis/Kafka가 필요한 @SpringBootTest는
  # 제외한다 — 아직 groovy-infra 연동 전이라 그 정책이 정해진 뒤 별도로 채운다.
  contract-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run event-contract schema tests
        run: ./gradlew :services:notification-service:test --tests "*ContractTest" --no-daemon
